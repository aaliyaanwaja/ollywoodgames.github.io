     js/brand.js (tools/make-brand.py). -->

<link rel="canonical" href="https://aaliyaanwaja.github.io/ollywoodgames.github.io/one-man-team/">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">

<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-title" content="One-Man Team">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ollywood Games">
<meta property="og:title" content="One-Man Team">
<meta property="og:description" content="A free football game in your browser where you play every player in one attacking move, one at a time.">
<meta property="og:url" content="https://aaliyaanwaja.github.io/ollywoodgames.github.io/one-man-team/">

<meta name="twitter:description" content="A free football game in your browser where you play every player in one attacking move, one at a time.">

<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <section id="home" class="screen" aria-label="Fixtures"></section>
  <section id="play" class="screen" aria-label="Match">
    <header id="hud">
      <div class="hud-row">
        <button class="ib" id="bMenu" aria-label="Pause"></button>
        <div id="who"></div>
        <button class="ib" id="bPrev" aria-label="Redo the previous player"></button>
        <button class="ib" id="bRetry" aria-label="Retry this player"></button>
      </div>
      <div id="clock">
        <div id="score" aria-live="polite"></div>
        <div id="bar" role="img" aria-label="Move clock"><div id="fill"></div><div id="marks"></div></div>
        <div id="secs"></div>
      </div>
    </header>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="toast" role="status"></div>
      <div id="stamp" aria-hidden="true"></div>
      <div id="ready" role="status"></div>
      <div id="dragchip" aria-hidden="true">Or just drag to go again</div>
      <button id="skip" class="chip">Tap to skip</button>
    </div>
    <div id="ctl">
      <div id="pad" aria-hidden="true"></div>
      <div id="rcard" role="status"></div>
      <div id="kickwrap"><span id="klabel"></span><button id="kick">PASS</button></div>
    </div>
  </section>
</div>
<div id="joy" class="stick" aria-hidden="true"><i></i></div>
<div id="aim" class="stick" aria-hidden="true"><i></i></div>
<div class="ov" id="ov"><div class="card" id="card" tabindex="-1"></div></div>
<div id="rotate" role="alert"></div>
<script src="js/levels/pack1.js"></script>
<script src="js/levels/pack2.js"></script>
<script src="js/levels/pack3.js"></script>
<script src="js/levels/pack4.js"></script>
<script src="js/levels/pack5.js"></script>
<script src="js/levels/pack6.js"></script>
<script src="js/levels/pack7.js"></script>
<script src="js/levels/pack8.js"></script>
<script src="js/levels/story.js"></script>
<script src="js/levels/pars.js"></script>
<script src="js/levels/practice.js"></script>
<script src="js/levels/daily.js"></script>
<script src="js/config.js"></script>
<script src="js/brand.js"></script>
<script src="js/sim.js"></script>
<script src="js/sounds.js"></script>
<script src="js/audio.js"></script>
<script src="js/render.js"></script>
<script src="js/game.js"></script>
</body>
</html>
