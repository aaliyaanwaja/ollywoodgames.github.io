<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F2EAD8">
<title>Ollywood Games</title>
<meta name="description" content="Ollywood Games: small, sharp mobile games.">
<style>
  @font-face { font-family: "Anton"; src: url("one-man-team/fonts/anton-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Barlow"; src: url("one-man-team/fonts/barlow-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "Barlow"; src: url("one-man-team/fonts/barlow-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "Barlow Condensed"; src: url("one-man-team/fonts/barlow-condensed-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "Barlow Condensed"; src: url("one-man-team/fonts/barlow-condensed-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-display: swap; }
  :root { --paper: #F2EAD8; --paper-shade: #E6DCC3; --ink: #14213D; --ink-soft: #4A5573; --chalk: #FBF8F0; --tomato: #E4572E; --mustard: #F2B705; --sky: #8EC5D6; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font: 500 16px/1.5 "Barlow", system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
  main { width: 100%; max-width: 640px; margin: 0 auto; padding: 20px 20px 56px; }
  .strip { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-block: 2px solid var(--ink); font: 600 11px/1.3 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .1em; text-transform: uppercase; }
  .strip a { color: inherit; text-decoration: none; }
  h1 { margin: 20px 0 8px; font: 400 44px/.95 "Anton", Impact, sans-serif; letter-spacing: .01em; text-transform: uppercase; text-shadow: 2px 2px 0 var(--tomato); }
  b { font-weight: 600; }
  a { color: var(--ink); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  h1 { font-size: clamp(56px, 19vw, 104px); line-height: .9; text-shadow: 4px 4px 0 var(--tomato); }
  .lede { margin: 16px 0 28px; font: 700 22px/1.15 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .04em; text-transform: uppercase; }
  .lbl { margin: 0 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--ink); font: 600 12px/1.2 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
  a.game { position: relative; display: flex; align-items: stretch; min-height: 104px; background: var(--chalk); border: 2px solid var(--ink); border-radius: 6px; box-shadow: 3px 3px 0 var(--ink); color: inherit; text-decoration: none; transition: transform .08s ease-out, box-shadow .08s ease-out; }
  a.game:active { transform: translate(3px, 3px); box-shadow: none; }
  a.game .stub { flex: none; display: flex; align-items: center; padding: 12px; background: var(--paper-shade); border-right: 2px dashed var(--ink); border-radius: 4px 0 0 4px; }
  a.game img { display: block; width: 72px; height: 72px; border: 2px solid var(--ink); border-radius: 6px; }
  a.game .body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 12px 14px; }
  a.game .body b { font: 400 26px/1 "Anton", Impact, sans-serif; letter-spacing: .01em; text-transform: uppercase; }
  a.game .body span { font-size: 15px; line-height: 1.35; }
  a.game .body em { align-self: flex-start; margin-top: 4px; padding: 3px 10px; background: var(--tomato); border: 2px solid var(--ink); border-radius: 4px; font: 700 14px/1.2 "Barlow Condensed", "Arial Narrow", sans-serif; font-style: normal; letter-spacing: .08em; text-transform: uppercase; }
  footer { margin-top: 32px; font: 600 13px/1.4 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .1em; text-transform: uppercase; }
  @media (prefers-reduced-motion: reduce) { a.game { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="strip"><span>Games in print</span><span>Est. on a phone</span></div>
  <h1>Ollywood Games</h1>
  <p class="lede">Small, sharp mobile games.</p>
  <p class="lbl">Now showing</p>
  <a class="game" href="one-man-team/">
    <span class="stub"><img src="one-man-team/icons/icon-192.png" alt=""></span>
    <span class="body"><b>One-Man Team</b><span>Build a football move one player at a time, then watch the whole team play it.</span><em>Play</em></span>
  </a>
  <footer><a href="privacy.html">Privacy policy</a></footer>
</main>
</body>
</html>
